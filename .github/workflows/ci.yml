name: Provera

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      # Testovi idu preko HTTP-a i u vise niti. To NIJE ukras: putanja do efemerida
      # je kod pyswisseph-a thread-local, pa direktan poziv ne bi uhvatio da radna
      # nit servera ne vidi fajlove i tiho izostavi Hirona iz karte.
      - name: Testovi servisa
        run: python -m test.test_service

      - name: Provera da Dockerfile radi
        run: docker build -t lunasomnia-ephemeris .

      - name: Provera zive slike
        run: |
          set -e
          docker run -d --name eph -p 8080:8080 lunasomnia-ephemeris
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS -X POST http://127.0.0.1:8080/v1/chart \
            -H 'Content-Type: application/json' \
            -d '{"utc":"2002-08-14T12:50:00Z","lat":44.8667,"lon":20.65}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert 'chiron' in d['positions'], 'Hiron nedostaje'; print('slika u redu, tela:', len(d['positions']))"
          docker rm -f eph
