name: Isporuka Worker-a

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  isporuka:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Testovi vremena
        run: npm test

      - name: Isporuka
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # Presudno: WASM i ubacivanje efemeridnih fajlova mogu da otkazu SAMO u pravom
      # runtime-u. Lokalni testovi to ne dopiru, a otkaz je tih - karta izgleda ispravno,
      # samo bez Hirona. Zato se ziva isporuka poredi sa etalonom iz /root/astro.
      - name: Provera zive isporuke
        run: |
          set -euo pipefail
          B=https://lunasomnia-ephemeris.simkora.workers.dev
          for i in $(seq 1 20); do
            curl -fsS "$B/health" >/dev/null 2>&1 && break
            sleep 3
          done
          odg=$(curl -fsS -X POST "$B/v1/chart" -H 'content-type: application/json' \
            -d '{"local":"2000-01-01T12:00","tz":"Europe/London","lat":51.4779,"lon":0.0}')
          printf '%s' "$odg" | jq -e '
            def blizu(a; b; sek): ((a - b + 540) % 360 - 180) | fabs | . * 3600 <= sek;
            if (.unavailable // {}) != {} then
              error("neka tela nisu izracunata: \(.unavailable)")
            elif (.positions | keys | length) < 14 then
              error("ocekivano 14 tela, dobijeno \(.positions | keys | length)")
            elif (.positions.chiron | not) then
              error("HIRON NEDOSTAJE - efemeridni fajl nije ubacen u WASM")
            elif blizu(.angles.asc; 24.266189; 1) | not then
              error("ASC promasen: \(.angles.asc)")
            elif blizu(.angles.mc; 279.611088; 1) | not then
              error("MC promasen: \(.angles.mc)")
            elif blizu(.positions.chiron.longitude; 251.617626; 1) | not then
              error("Hiron promasen: \(.positions.chiron.longitude)")
            elif blizu(.positions.sun.longitude; 280.368919; 1) | not then
              error("Sunce promaseno: \(.positions.sun.longitude)")
            else
              "uzivo i tacno: \(.positions | keys | length) tela, ASC \(.angles.asc), Hiron \(.positions.chiron.degree)"
            end'

          echo ""
          echo "=== Mesec, pomracenja, Sunce ==="
          curl -fsS "$B/v1/moon?from=2026-09-01&count=4" | jq -e '
            if (.phases | length) != 4 then error("ocekivane 4 mene")
            elif ([.phases[] | select(.phase=="full" and .illumination < 0.98)] | length) > 0
              then error("pun mesec sa osvetljenoscu ispod 0.98")
            else "mene: \(.phases | map(.phase + " " + .utc) | join(", "))" end'
          curl -fsS "$B/v1/sun?year=2026" | jq -e '
            if (.events | length) != 4 then error("ocekivana 4 dogadjaja")
            else "Sunce: \(.events | map(.event + " " + .utc) | join(", "))" end'
          curl -fsS "$B/v1/eclipses?from=2026-09-01&count=2" | jq -e '
            if ([.eclipses[] | select(.type=="unknown")] | length) > 0
              then error("pomracenje bez vrste")
            else "pomracenja: \(.eclipses | map(.kind + " " + .type) | join(", "))" end'

          echo ""
          echo "=== CORS ==="
          # Zatvoren spisak porekla ne vredi nista ako se ne proveri da tudje ODBIJA.
          nase=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$B/v1/chart" \
            -H 'Origin: https://lunasomnia.com' \
            -H 'Access-Control-Request-Method: POST')
          tudje=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$B/v1/chart" \
            -H 'Origin: https://zlonamerni.example' \
            -H 'Access-Control-Request-Method: POST')
          zaglavlje=$(curl -sS -D - -o /dev/null -X POST "$B/v1/chart" \
            -H 'Origin: https://lunasomnia.com' -H 'content-type: application/json' \
            -d '{"utc":"2000-01-01T12:00:00Z","lat":51.4779,"lon":0.0}' \
            | grep -ci 'access-control-allow-origin: https://lunasomnia.com' || true)
          echo "  nas OPTIONS:    $nase   (ocekivano 204)"
          echo "  tudji OPTIONS:  $tudje   (ocekivano 403)"
          echo "  zaglavlje na POST-u: $zaglavlje  (ocekivano 1)"
          [ "$nase" = "204" ] || { echo "nas origin nije propusten"; exit 1; }
          [ "$tudje" = "403" ] || { echo "TUDJI ORIGIN JE PROPUSTEN"; exit 1; }
          [ "$zaglavlje" = "1" ] || { echo "nema allow-origin na odgovoru"; exit 1; }
